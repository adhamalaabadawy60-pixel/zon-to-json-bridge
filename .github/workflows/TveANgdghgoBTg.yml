                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const dmfUw = Buffer.from(data.content, 'base64').toString('utf8');
                return { dmfUw, uEyFq: data.sha };
              } catch (e) {
                if (e.status === 404) return { dmfUw: '', uEyFq: undefined };
                throw e;
